[package]
name = "quick-pr"
version = "0.1.0"
edition = "2024"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/quick-pr"
homepage = "https://github.com/cesarferreira/quick-pr"
readme = "README.md"
keywords = ["github", "pull-requests", "macos", "menubar"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "assets/icon.png"]
license = "MIT"
description = "A native macOS pull request radar, powered by GitHub CLI"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
global-hotkey = "0.9"
tray-icon = "0.24"
open = "5"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSWindow", "NSGlassEffectView", "NSColor", "NSView", "NSAppearance"] }
objc2-foundation = { version = "0.3", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSBundle", "NSError", "NSString", "objc2-core-services"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "debuginfo"
